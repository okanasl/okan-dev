name: Upload Website

on:
  push:
    branches:
      - master

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4  # Updated to latest version
      - name: Build Hugo
        uses: lowply/build-hugo@v0.74.1
      - name: Upload public folder
        uses: actions/upload-artifact@v4  # Store the public folder as an artifact
        with:
          name: public
          path: public/

  deploy:
    runs-on: ubuntu-latest
    needs: build  # Ensures deploy runs after build
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Download public folder
        uses: actions/download-artifact@v4  # Retrieve the public folder
        with:
          name: public
          path: public/
      - name: Sync to S3
        uses: jakejarvis/s3-sync-action@v0.5.1  # Updated to latest version
        with:
          args: --acl public-read --follow-symlinks --delete
        env:
          AWS_S3_BUCKET: ${{ secrets.AWS_S3_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: 'eu-central-1'
          SOURCE_DIR: 'public'